<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>道歉与购物车</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="apology">
        <h1>对不起！</h1>
        <p>我们非常抱歉给您带来了不便。</p>
    </div>

    <div class="product-tabs">
        <div class="product-tab active" onclick="showProducts('products1')">商品1</div>
        <div class="product-tab" onclick="showProducts('products2')">商品2</div>
    </div>

    <div id="products1" class="products active">
        <div class="product" onclick="addToCart('商品A', 10, event)">商品A - ¥10</div>
        <div class="product" onclick="addToCart('商品B', 20, event)">商品B - ¥20</div>
    </div>

    <div id="products2" class="products">
        <div class="product" onclick="addToCart('商品C', 30, event)">商品C - ¥30</div>
        <div class="product" onclick="addToCart('商品D', 40, event)">商品D - ¥40</div>
    </div>

    <div class="cart">
        <h3>购物车</h3>
        <div id="cart-items"></div>
        <div class="total">总计: ¥<span id="total">0</span></div>
        <button onclick="showModal()">下单</button>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="runner"></div>
            <p>gxg努力搬砖中，请稍候～</p>
        </div>
    </div>

    <div id="contact-info" class="contact-info"></div>

    <script src="script.js"></script>
</body>
</html>
