<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>道歉网页</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>对不起！</h1>
        <p>我们很抱歉给您带来了不便，请选择以下商品以表达我们的歉意。</p>

        <div class="tabs">
            <button class="tab-button active" onclick="openTab('tab1')">商品1</button>
            <button class="tab-button" onclick="openTab('tab2')">商品2</button>
            <button class="tab-button" onclick="openTab('tab3')">商品3</button>
        </div>

        <div id="tab1" class="tab-content">
            <h3>商品1</h3>
            <p>这是我们的第一个商品。</p>
            <button onclick="addToCart('商品1', 10)">加入购物车</button>
        </div>

        <div id="tab2" class="tab-content" style="display: none;">
            <h3>商品2</h3>
            <p>这是我们的第二个商品。</p>
            <button onclick="addToCart('商品2', 20)">加入购物车</button>
        </div>

        <div id="tab3" class="tab-content" style="display: none;">
            <h3>商品3</h3>
            <p>这是我们的第三个商品。</p>
            <button onclick="addToCart('商品3', 30)">加入购物车</button>
        </div>

        <div class="cart">
            <h2>购物车</h2>
            <ul id="cart-items">
                <!-- 购物车内容将通过JavaScript动态添加 -->
            </ul>
            <p id="total-price">总价: 0</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
